services:
  folio:
    image: ghcr.io/asano69/folio:latest
    container_name: folio
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - folio.env
    volumes:
      - ./data:/folio/data
      - ./import:/folio/import
        #- /etc/ssl/certs/root_ca.crt:/certs/root_ca.crt:ro # optional
    environment:
      - TZ=Etc/UTC
      #
      - FOLIO_SERVER_HOST=0.0.0.0
      - FOLIO_SERVER_PORT=3000
      - FOLIO_IMPORT_DIR=./import
      - FOLIO_DATA_DIR=/folio/data
